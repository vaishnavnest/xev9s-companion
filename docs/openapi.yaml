        - active
        - paused
        - completed
        - interrupted
        - cancelled

    ChargingSessionResponse:
      type: object
      required:
        - session_id
        - vehicle_id
        - started_at
        - starting_battery_percentage
        - target_percentage
        - charging_power_kw
        - duration_seconds
        - status
      properties:
        session_id:
          type: string
        vehicle_id:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        starting_battery_percentage:
          type: number
          format: float
        ending_battery_percentage:
          type: number
          format: float
          nullable: true
        target_percentage:
          type: number
          format: float
        final_target_percentage:
          type: number
          format: float
          nullable: true
        charging_power_kw:
          type: number
          format: float
        average_charging_power_kw:
          type: number
          format: float
          nullable: true
        peak_charging_power_kw:
          type: number
          format: float
          nullable: true
        duration_seconds:
          type: number
          format: float
        status:
          $ref: '#/components/schemas/ChargingSessionStatus'
        interruption_reason:
          type: string
          nullable: true

    ChargingSessionHistoryResponse:
      type: object
      required:
        - sessions
        - count
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ChargingSessionResponse'
        count:
          type: integer
