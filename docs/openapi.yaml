openapi: 3.0.3
info:
  title: XEV 9S Backend API
  version: 1.0.0
  description: |
    # XEV 9S Connected Vehicle Platform Backend API

    This OpenAPI specification documents the **actual implementation** of the FastAPI backend for the XEV 9S Connected Vehicle Companion Platform.

    ## 1. Architectural Conventions & Protocols
    * **Base URL / Mount Path:** Routes are mounted at root (`/`). There is **no** `/api/v1` prefix.
    * **No Response Envelopes:** All responses return raw JSON objects or lists (e.g. `UserResponse`, `TokenResponse`, `{"vehicles": [...]}`). The backend does **not** wrap responses in `{ success, data, meta, error }`.
    * **JSON Key Casing:** All request and response JSON properties use `snake_case` (e.g. `full_name`, `access_token`, `vehicle_id`, `battery_percentage`, `speed_kph`).
    * **Enum Naming:** Enums are lowercase strings (e.g. `"parked"`, `"driving"`, `"charging"`, `"interrupted"`, `"active"`).
    * **Timestamps:** ISO-8601 UTC formatted strings (`datetime` in Python).
    * **Security:** Authenticated endpoints require a JWT Bearer token passed in the `Authorization` header (`Bearer <access_token>`).

    ## 2. Multi-Protocol Transport Overview
    The platform employs three distinct transport layers:
    1. **HTTP/REST (Port 8000/8080):** Serves client authentication, vehicle association, and telemetry queries.
    2. **WebSocket (`/ws/vehicles/{vehicle_id}`):** Realtime vehicle telemetry stream to connected frontend clients.
       * Handshake: Client opens connection to `/ws/vehicles/{vehicle_id}`.
       * Authentication: The client **must** send an initial JSON text frame: `{"token": "<jwt_access_token>"}`.
       * Validation: The server validates the token, verifies the user is active, and verifies the vehicle is associated with the user. If any check fails, the socket closes with code `1008` (Policy Violation).
       * Broadcasting: When new telemetry is ingested via MQTT, the backend broadcasts a JSON `TelemetryResponse` object to all active connections for that `vehicle_id`.
       * Server Shutdown: The server closes active sockets with code `1001` (Going Away).
    3. **MQTT (Broker port 1883/1884):** Telemetry ingestion channel from the vehicle simulator.
       * Topic: `xev9s/vehicles/{vehicle_id}/telemetry`
       * Direction: Simulator -> Backend
       * Subscriber QoS: `0` (Backend subscriber)
       * Publisher QoS: `1` (Simulator client)
       * Ingest Payload: Validated against `TelemetryPayload` schema before persisting to MongoDB.

    ## 3. Implemented vs. Unimplemented Subsystems
    This specification documents **only** the features currently implemented in the FastAPI backend (`backend/app`).
    The following subsystems are defined in initial product requirements or frontend mockups, but are **NOT implemented in the backend**:
    * **Remote Vehicle Commands (UC-05):** `POST /vehicles/{id}/commands`, command history, and state transitions are not implemented.
    * **Charging Management (UC-04):** `GET /vehicles/{id}/charging`, target setting, recurring schedules, and charging sessions are not implemented.
    * **User Profile & Preferences (UC-09):** `PATCH /users/me`, notification preferences, and unit preferences are not implemented.
    * **Standalone Vehicle Location (UC-03):** `GET /vehicles/{id}/location` is not implemented (GPS coordinates are returned inside telemetry records).
    * **Trips & History (UC-06):** `GET /vehicles/{id}/trips` is not implemented.
    * **Driving & Energy Analytics (UC-07):** `GET /vehicles/{id}/analytics` is not implemented.
    * **In-App Notifications (UC-08):** `GET/PATCH /notifications` is not implemented.
    * **PDF/CSV Reports:** Report generation workers and download endpoints are not implemented.
    * **Prometheus Metrics:** `/metrics` is not implemented.

servers:
  - url: http://localhost:8000
    description: Default local FastAPI development server
  - url: http://localhost:8080
    description: Alternative local / container deployment server

tags:
  - name: Root & Operations
    description: Service health probes and root status endpoint.
  - name: Authentication
    description: User registration, login, token refresh, logout, and authenticated user profile.
  - name: Vehicles
    description: Vehicle association and retrieval of associated vehicles.
  - name: Vehicle Telemetry
    description: Querying latest and historical telemetry records for associated vehicles.
  - name: Realtime (WebSocket)
    description: Realtime streaming of vehicle telemetry via WebSocket.
  - name: Internal (MQTT)
    description: Simulator-to-backend MQTT telemetry ingestion contract.

paths:
  /:
    get:
      tags: [Root & Operations]
      summary: Root service check
      description: Returns confirmation that the backend service is running.
      operationId: rootServiceCheck
      responses:
        '200':
          description: Service is operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'

  /health:
    get:
      tags: [Root & Operations]
      summary: Health check
      description: Returns service liveness status.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/database:
    get:
      tags: [Root & Operations]
      summary: Database health check
      description: Verifies MongoDB connectivity via a ping command.
      operationId: databaseHealthCheck
      responses:
        '200':
          description: MongoDB connection is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
        '503':
          description: Database connection unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: |
        Creates a new user account with hashed password in MongoDB.
        Note: The backend validates that `password == confirm_password`.
        Returns the created user record (`UserResponse`) without tokens.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Validation error (e.g. Passwords do not match or invalid format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      description: |
        Validates email and password, creates a session record, and issues access and refresh tokens.
        Access token expires in 15 minutes (or `JWT_ACCESS_TOKEN_EXPIRE_MINUTES`).
        Refresh token expires in 7 days (or `REFRESH_TOKEN_EXPIRE_DAYS`).
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Incorrect email or password, or user account inactive.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Rotates the submitted refresh token and generates a new access token and new refresh token.
        Detects token reuse; revokes the session if reuse is detected.
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or revoked refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Revokes the specified refresh token and invalidates the session.
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid or already revoked refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Request validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      description: |
        Returns the profile details of the user associated with the Bearer JWT token.
        Note: The backend mounts this endpoint at `/auth/me` (not `/users/me`).
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile of the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid or expired authentication token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'

  /vehicles:
    get:
      tags: [Vehicles]
      summary: Retrieve associated vehicles
      description: Retrieves all vehicles associated with the authenticated user.
      operationId: getMyVehicles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of vehicles associated with the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '401':
          description: Invalid or expired authentication token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'

  /vehicles/associate:
    post:
      tags: [Vehicles]
      summary: Associate a vehicle with user account
      description: |
        Associates an active vehicle with the authenticated user account using its pairing code.
        Note: The backend mounts this endpoint at `POST /vehicles/associate` (not `POST /vehicles`).
        The request model strictly forbids additional properties (`extra="forbid"`).
      operationId: associateVehicle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAssociationRequest'
      responses:
        '201':
          description: Vehicle associated successfully. Returns updated vehicle list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
        '400':
          description: Invalid, expired, or used pairing code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '401':
          description: Invalid or expired authentication token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '409':
          description: Vehicle is already associated with this user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Request validation error (e.g. Empty fields or extraneous properties).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /vehicles/{vehicle_id}/telemetry/latest:
    get:
      tags: [Vehicle Telemetry]
      summary: Get latest telemetry for vehicle
      description: |
        Retrieves the most recent telemetry snapshot for the vehicle.
        Requires that the vehicle is associated with the authenticated user.
        Note: The backend mounts this at `/vehicles/{vehicle_id}/telemetry/latest` (not `/vehicles/{vehicleId}/status`).
      operationId: getLatestTelemetry
      security:
        - BearerAuth: []
      parameters:
        - name: vehicle_id
          in: path
          required: true
          description: Identifier of the vehicle.
          schema:
            type: string
      responses:
        '200':
          description: Latest telemetry record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '401':
          description: Invalid or expired authentication token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '403':
          description: Access denied (vehicle is not associated with this user).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '404':
          description: No telemetry available for this vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'

  /vehicles/{vehicle_id}/telemetry/history:
    get:
      tags: [Vehicle Telemetry]
      summary: Get telemetry history for vehicle
      description: |
        Retrieves historical telemetry records within the specified time range.
        Requires vehicle association.
        Note: Path is `/vehicles/{vehicle_id}/telemetry/history` and uses query parameters `start_time` and `end_time`.
      operationId: getTelemetryHistory
      security:
        - BearerAuth: []
      parameters:
        - name: vehicle_id
          in: path
          required: true
          description: Identifier of the vehicle.
          schema:
            type: string
        - name: start_time
          in: query
          required: true
          description: Beginning of the time window (ISO-8601).
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          description: End of the time window (ISO-8601). Must be after start_time.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1-1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Collection of historical telemetry records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistoryResponse'
        '401':
          description: Invalid or expired authentication token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '403':
          description: Access denied (vehicle is not associated with this user).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPException'
        '422':
          description: Invalid query parameters (e.g. start_time > end_time or limit out of bounds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /ws/vehicles/{vehicle_id}:
    get:
      tags: [Realtime (WebSocket)]
      summary: Vehicle telemetry streaming WebSocket
      description: |
        ### WebSocket Connection Contract
        * **Protocol:** `ws://` or `wss://`
        * **Path:** `/ws/vehicles/{vehicle_id}`
        * **Connection Handshake:** Server accepts connection (`await websocket.accept()`).
        * **Client Authentication:** Immediately after connection, client **must** send a JSON frame:
          ```json
          { "token": "<jwt_access_token>" }
          ```
        * **Connection Validation:** Server decodes JWT `sub`, checks user exists and is active, and verifies vehicle is associated with user.
        * **Closure Codes:**
          * `1008` (Policy Violation): Token missing, invalid, expired, user inactive, or vehicle not associated.
          * `1001` (Going Away): Server shutdown (`WebSocketManager.disconnect_all()`).
        * **Server Broadcast:** Server sends `TelemetryResponse` JSON frames whenever new telemetry is ingested via MQTT for `vehicle_id`.
      operationId: streamVehicleTelemetryWebSocket
      parameters:
        - name: vehicle_id
          in: path
          required: true
          description: Identifier of the vehicle to stream telemetry for.
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Access Token issued by `POST /auth/login` or `POST /auth/refresh`.
        Format: `Authorization: Bearer <access_token>`.

  schemas:
    RootResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: XEV 9S Backend is running

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: healthy

    DatabaseHealthResponse:
      type: object
      required: [database]
      properties:
        database:
          type: string
          example: connected

    UserCreate:
      type: object
      description: Data submitted to register a new user account.
      required:
        - full_name
        - email
        - password
        - confirm_password
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 80
          example: Asha Nair
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecureP@ssw0rd!
        confirm_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecureP@ssw0rd!

    UserLogin:
      type: object
      description: Credentials submitted during user login.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecureP@ssw0rd!

    UserResponse:
      type: object
      description: Public user information returned by the API.
      required:
        - id
        - email
        - full_name
        - is_active
        - created_at
      properties:
        id:
          type: string
          example: 673c52a0e4b0a1d2f3e4b5c6
        email:
          type: string
          format: email
          example: owner@example.com
        full_name:
          type: string
          example: Asha Nair
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-11-20T10:00:00Z'

    TokenResponse:
      type: object
      description: Authentication tokens returned after successful login or refresh.
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: 48-character-opaque-url-safe-token
        token_type:
          type: string
          default: bearer
          example: bearer
        expires_in:
          type: integer
          description: Lifetime of access_token in seconds (e.g. 900 for 15 minutes).
          example: 900

    RefreshTokenRequest:
      type: object
      description: Refresh token submitted to renew access token or log out.
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 48-character-opaque-url-safe-token

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Logged out successfully

    VehicleAssociationRequest:
      type: object
      description: Vehicle identifier and pairing code submitted for association. Extra properties forbidden.
      required:
        - vehicle_id
        - pairing_code
      properties:
        vehicle_id:
          type: string
          minLength: 1
          maxLength: 64
          example: veh_9S0001
        pairing_code:
          type: string
          minLength: 1
          maxLength: 128
          example: '482913'
      additionalProperties: false

    VehicleResponse:
      type: object
      description: Vehicle information returned to its associated user.
      required:
        - vehicle_id
        - model
        - association_status
        - associated_at
      properties:
        vehicle_id:
          type: string
          example: veh_9S0001
        model:
          type: string
          example: XEV 9S
        association_status:
          type: string
          enum: [active]
          example: active
        associated_at:
          type: string
          format: date-time
          example: '2026-11-20T10:05:00Z'

    VehicleListResponse:
      type: object
      description: List of vehicles associated with the authenticated user.
      required:
        - vehicles
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'

    OperatingState:
      type: string
      description: Operational motion and power state of the vehicle.
      enum:
        - parked
        - driving
        - charging
        - interrupted
      example: parked

    ChargingStatus:
      type: string
      description: High-voltage battery charging status.
      enum:
        - disconnected
        - connected
        - charging
        - interrupted
      example: disconnected

    TelemetryPayload:
      type: object
      description: Validated telemetry payload received over MQTT topic `xev9s/vehicles/{vehicle_id}/telemetry`.
      required:
        - vehicle_id
        - timestamp
        - battery_percentage
        - estimated_range_km
        - speed_kph
        - odometer_km
        - operating_state
        - is_locked
        - charging_status
        - charging_power_kw
        - cabin_preconditioning_active
      properties:
        vehicle_id:
          type: string
          minLength: 1
          maxLength: 64
          example: veh_9S0001
        timestamp:
          type: string
          format: date-time
          example: '2026-11-24T14:30:00Z'
        battery_percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 64.0
        estimated_range_km:
          type: number
          format: float
          minimum: 0
          example: 312.5
        speed_kph:
          type: number
          format: float
          minimum: 0
          example: 0.0
        odometer_km:
          type: number
          format: float
          minimum: 0
          example: 12874.3
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          example: 12.9716
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          example: 77.5946
        operating_state:
          $ref: '#/components/schemas/OperatingState'
        is_locked:
          type: boolean
          example: true
        charging_status:
          $ref: '#/components/schemas/ChargingStatus'
        charging_power_kw:
          type: number
          format: float
          minimum: 0
          example: 0.0
        cabin_preconditioning_active:
          type: boolean
          example: false
      additionalProperties: false

    TelemetryResponse:
      type: object
      description: Stored vehicle telemetry record returned by REST endpoints and broadcast over WebSocket.
      required:
        - vehicle_id
        - timestamp
        - battery_percentage
        - estimated_range_km
        - speed_kph
        - odometer_km
        - operating_state
        - is_locked
        - charging_status
        - charging_power_kw
        - cabin_preconditioning_active
        - received_at
      properties:
        vehicle_id:
          type: string
          example: veh_9S0001
        timestamp:
          type: string
          format: date-time
          example: '2026-11-24T14:30:00Z'
        battery_percentage:
          type: number
          format: float
          example: 64.0
        estimated_range_km:
          type: number
          format: float
          example: 312.5
        speed_kph:
          type: number
          format: float
          example: 0.0
        odometer_km:
          type: number
          format: float
          example: 12874.3
        latitude:
          type: number
          format: float
          nullable: true
          example: 12.9716
        longitude:
          type: number
          format: float
          nullable: true
          example: 77.5946
        operating_state:
          $ref: '#/components/schemas/OperatingState'
        is_locked:
          type: boolean
          example: true
        charging_status:
          $ref: '#/components/schemas/ChargingStatus'
        charging_power_kw:
          type: number
          format: float
          example: 0.0
        cabin_preconditioning_active:
          type: boolean
          example: false
        received_at:
          type: string
          format: date-time
          example: '2026-11-24T14:30:01Z'

    TelemetryHistoryResponse:
      type: object
      description: Collection of historical vehicle telemetry records.
      required:
        - telemetry
        - count
      properties:
        telemetry:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryResponse'
        count:
          type: integer
          example: 42

    WebSocketAuthMessage:
      type: object
      description: Initial payload message sent by the client immediately after establishing WebSocket connection.
      required:
        - token
      properties:
        token:
          type: string
          description: JWT Access Token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    HTTPException:
      type: object
      description: Standard error response structure returned by FastAPI HTTPException.
      required:
        - detail
      properties:
        detail:
          type: string
          example: Invalid or expired authentication token

    HTTPValidationError:
      type: object
      description: Request validation failure response returned by FastAPI when Pydantic validation fails.
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      description: Specific field-level validation issue.
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          example: ["body", "email"]
        msg:
          type: string
          example: value is not a valid email address
        type:
          type: string
          example: value_error.email
