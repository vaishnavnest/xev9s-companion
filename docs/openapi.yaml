    ChargingPreferencesResponse:
      type: object
      required:
        - vehicle_id
        - target_percentage
        - schedule_enabled
        - scheduled_days
        - timezone
        - stop_charging_at_target
      properties:
        vehicle_id:
          type: string
          example: veh_9S0001
        target_percentage:
          type: number
          format: float
          example: 80.0
        schedule_enabled:
          type: boolean
        scheduled_start_time:
          type: string
          nullable: true
        scheduled_end_time:
          type: string
          nullable: true
        scheduled_days:
          type: array
          items:
            $ref: '#/components/schemas/Weekday'
        timezone:
          type: string
          example: UTC
        stop_charging_at_target:
          type: boolean

    ChargingSessionStatus:
      type: string
