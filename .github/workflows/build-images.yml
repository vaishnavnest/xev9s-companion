name: Container Build, Security Scan & Release Artefacts

on:
  push:
    branches:
      - dev
      - 'release/*'
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Build, Scan & Publish the 4 Application Container Images
  build-and-publish-images:
    name: Build & Scan Image - ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: xev9s-flutter-web
            context: ./frontend/xev9s_app
            dockerfile: ./frontend/xev9s_app/Dockerfile
            build_args: API_BASE_URL=http://localhost:8000
          - image_name: xev9s-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - image_name: xev9s-vehicle-simulator
            context: ./simulator
            dockerfile: ./simulator/Dockerfile
            build_args: ""
          - image_name: xev9s-report-worker
            context: ./report-worker
            dockerfile: ./report-worker/Dockerfile
            build_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image locally for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: ${{ matrix.image_name }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image_name }}:scan-${{ github.sha }}
          format: cyclonedx-json
          output-file: ${{ matrix.image_name }}-sbom.json

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image_name }}-sbom
          path: ${{ matrix.image_name }}-sbom.json
          retention-days: 14

      - name: Push image to GHCR
        id: push-step
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record Image Digest
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.push-step.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy Scan:** Passed (0 Critical/High unfixed CVEs)" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM:** Generated (\`${{ matrix.image_name }}-sbom.json\`)" >> $GITHUB_STEP_SUMMARY


  # 2. Compile and Publish Flutter Android APK Release Artefact
  build-android-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=http://localhost:8000 \
            --dart-define=WS_BASE_URL=ws://localhost:8000/ws \
            --dart-define=REALTIME_MODE=ws

      - name: Upload Android APK Artefact
        uses: actions/upload-artifact@v4
        with:
          name: xev9s-companion-android-apk
          path: frontend/xev9s_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14


  # 3. Publish Comprehensive Build & Packaging Report
  publish-build-report:
    name: Publish Release Build Report
    runs-on: ubuntu-latest
    needs:
      - build-and-publish-images
      - build-android-apk
    if: always()

    steps:
      - name: Publish Summary to GitHub Actions
        run: |
          echo "## 📦 Release Packaging & Container Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric / Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Reference** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry Target** | \`${{ env.REGISTRY }}/${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Images Built** | \`xev9s-flutter-web\`, \`xev9s-backend\`, \`xev9s-vehicle-simulator\`, \`xev9s-report-worker\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Vulnerability Scan** | Aquasecurity Trivy (Critical & High Severity Gate) |" >> $GITHUB_STEP_SUMMARY
          echo "| **SBOM Generation** | Anchore Syft (CycloneDX JSON) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mobile Release Artefact** | \`app-release.apk\` (Flutter Android Release) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> All application container images are built once and tagged with immutable Git SHA digests for promotion to both **AWS Service Simulation** and **On-Premises Kubernetes** targets." >> $GITHUB_STEP_SUMMARY
