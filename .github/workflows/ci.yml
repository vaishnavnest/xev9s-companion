name: Unified CI & Security Pipeline

on:
  pull_request:
    branches: [dev, 'release/*', main]

jobs:
  # 1. Frontend Validation (Runs when frontend or workflow files change)
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - name: Setup Flutter
        if: steps.filter.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: flutter pub get

      - name: Analyze code
        if: steps.filter.outputs.frontend == 'true'
        run: flutter analyze

      - name: Run tests with coverage
        if: steps.filter.outputs.frontend == 'true'
        run: flutter test --coverage

      - name: Enforce 70% Line Coverage & Generate HTML Report
        if: steps.filter.outputs.frontend == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | tr -d '%')
          if [ -z "$COVERAGE" ]; then
            echo "❌ Failed to parse coverage percentage from lcov output."
            exit 1
          fi
          echo "### Flutter Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Line Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Threshold:** 70.0%" >> $GITHUB_STEP_SUMMARY
          genhtml coverage/lcov.info -o coverage/html
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70.0) { print "❌ Coverage " cov "% is below the 70% threshold!"; exit 1 } }'
          echo "✅ Coverage check passed (${COVERAGE}% >= 70.0%)"

      - name: Upload Flutter HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.frontend == 'true'
        with:
          name: flutter-html-coverage-report
          path: frontend/xev9s_app/coverage/html

# 2. FastAPI Backend Validation (Runs when backend tests exist and backend files change)
  backend-verify:
    name: FastAPI Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if backend changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - name: Enforce 200-Line Limit on backend/app Python Files
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/app/**') != ''
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 200 ]; then
              echo "❌ $file has $LINES lines (limit is 200)"
              FAILED=1
            fi
          done < <(find backend/app -name "*.py" -print0)
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "✅ All backend/app Python files are within 200 lines."

      - name: Setup Python
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI Dependencies & Test Tools
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install fastapi uvicorn httpx pytest pytest-cov ruff

      - name: Lint Python & FastAPI Code
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**') != ''
        run: |
          cd backend
          ruff check .

      - name: Validate FastAPI App & OpenAPI Schema
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**') != ''
        env:
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DB_NAME: "Xev9s_db"
          JWT_SECRET: "test_only_non_secret_jwt_value_32_characters_minimum" # gitleaks:allow
          JWT_SECRET_KEY: "test_only_non_secret_jwt_value_32_characters_minimum" # gitleaks:allow
        run: |
          cd backend
          python -c "from app.main import app; schema = app.openapi(); print(f'✅ FastAPI OpenAPI schema valid ({len(schema.get(\"paths\", {}))} endpoints registered)')"

      - name: Run FastAPI Pytest Suite with 70% Coverage Gate
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**') != ''
        env:
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DB_NAME: "Xev9s_db"
          JWT_SECRET: "test_only_non_secret_jwt_value_32_characters_minimum" # gitleaks:allow
          JWT_SECRET_KEY: "test_only_non_secret_jwt_value_32_characters_minimum" # gitleaks:allow
        run: |
          cd backend
          pytest tests --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=70 -v

      - name: Upload Backend HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.backend == 'true' && hashFiles('backend/htmlcov/**') != ''
        with:
          name: backend-html-coverage-report
          path: backend/htmlcov

  # 3. Pre-Merge Security Scans (Runs on EVERY Pull Request)
  security-scan:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

      - name: Install & Run Trivy Dependency Vulnerability Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln,misconfig --severity CRITICAL,HIGH --exit-code 1 .

  # 4. Single Unified Gate for Branch Protection
  ci-gate:
    name: Mandatory CI Gate
    runs-on: ubuntu-latest
    needs: [flutter-verify, backend-verify, security-scan]
    if: always()
    steps:
      - name: Evaluate Mandatory Checks
        run: |
          echo "Flutter result: ${{ needs.flutter-verify.result }}"
          echo "Backend result: ${{ needs.backend-verify.result }}"
          echo "Security result: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.flutter-verify.result }}" != "success" && "${{ needs.flutter-verify.result }}" != "skipped" ]]; then
            echo "❌ Flutter checks failed!"
            exit 1
          fi
          if [[ "${{ needs.backend-verify.result }}" != "success" && "${{ needs.backend-verify.result }}" != "skipped" ]]; then
            echo "❌ Backend checks failed!"
            exit 1
          fi
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ Security scans failed!"
            exit 1
          fi
          echo "✅ All mandatory CI and security gates passed!"