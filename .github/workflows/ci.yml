
name: Unified CI & Security Pipeline

on:
  pull_request:
    branches: [dev, 'release/*', main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # 1. Flutter Frontend Validation
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if frontend changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci.yml'

      - name: Setup Flutter
        if: steps.filter.outputs.frontend == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: flutter pub get

      - name: Analyze Flutter code
        if: steps.filter.outputs.frontend == 'true'
        run: flutter analyze

      - name: Run Flutter tests with coverage
        if: steps.filter.outputs.frontend == 'true'
        run: flutter test --coverage

      - name: Enforce 70% Line Coverage & Generate HTML Report
        if: steps.filter.outputs.frontend == 'true'
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "Coverage report is missing or empty."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y lcov=2.0-4ubuntu2

          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 |
            sed -nE 's/.*lines[^:]*: ([0-9.]+)%.*/\1/p' |
            head -n 1)

          if [ -z "$COVERAGE" ]; then
            echo "Failed to parse coverage percentage."
            exit 1
          fi

          echo "### Flutter Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Line Coverage:** ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Required Threshold:** 70.0%" >> "$GITHUB_STEP_SUMMARY"

          genhtml coverage/lcov.info -o coverage/html

          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov < 70.0) {
              print "Coverage " cov "% is below the 70% threshold!"
              exit 1
            }
          }'

          echo "Flutter coverage check passed (${COVERAGE}% >= 70.0%)"

      - name: Upload Flutter HTML Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.filter.outputs.frontend == 'true' && hashFiles('frontend/xev9s_app/coverage/html/index.html') != ''
        with:
          name: flutter-html-coverage-report
          path: frontend/xev9s_app/coverage/html


  # 2. FastAPI Backend Validation
  backend-verify:
    name: FastAPI Backend Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if backend changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci.yml'

      - name: Check backend availability
        id: backend-check
        if: steps.filter.outputs.backend == 'true'
        run: |
          if [ -f backend/app/main.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Backend application found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Backend application not found. Skipping backend validation."
          fi

      - name: Verify backend requirements and tests
        if: steps.backend-check.outputs.available == 'true'
        run: |
          if [ ! -f backend/requirements.txt ]; then
            echo "backend/requirements.txt is missing."
            exit 1
          fi

          if [ ! -d backend/tests ]; then
            echo "backend/tests directory is missing."
            exit 1
          fi

          echo "Backend requirements and test directories found."

      - name: Setup Python
        if: steps.backend-check.outputs.available == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        if: steps.backend-check.outputs.available == 'true'
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.6

      - name: Enforce 200-Line Limit
        if: steps.backend-check.outputs.available == 'true'
        run: |
          FAILED=0

          while IFS= read -r -d '' file; do
            LINES=$(wc -l < "$file")

            if [ "$LINES" -gt 200 ]; then
              echo "$file has $LINES lines (limit is 200)"
              FAILED=1
            fi
          done < <(find backend/app -name "*.py" -print0)

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All backend Python files are within 200 lines."

      - name: Lint Python Code
        if: steps.backend-check.outputs.available == 'true'
        working-directory: backend
        run: ruff check .

      - name: Validate FastAPI App & OpenAPI Schema
        if: steps.backend-check.outputs.available == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: Xev9s_db
          JWT_SECRET: test_only_non_secret_jwt_value_32_characters_minimum # gitleaks:allow
          JWT_SECRET_KEY: test_only_non_secret_jwt_value_32_characters_minimum # gitleaks:allow
        run: |
          python -c "from backend.app.main import app; schema = app.openapi(); print(f'FastAPI OpenAPI schema valid ({len(schema.get(\"paths\", {}))} endpoints registered)')"

      - name: Run Backend Tests with 70% Coverage Gate
        if: steps.backend-check.outputs.available == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: Xev9s_db
          JWT_SECRET: test_only_non_secret_jwt_value_32_characters_minimum # gitleaks:allow
          JWT_SECRET_KEY: test_only_non_secret_jwt_value_32_characters_minimum # gitleaks:allow
        run: |
          pytest backend/tests \
            --cov=backend.app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            -v

          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.1f}\")")

          echo "### FastAPI Backend Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Line Coverage:** ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Required Threshold:** 70.0%" >> "$GITHUB_STEP_SUMMARY"

          python -c "
          cov = float('$COVERAGE')
          if cov < 70.0:
              print(f'Backend coverage {cov}% is below the 70.0% threshold!')
              exit(1)
          print(f'Backend coverage check passed ({cov}% >= 70.0%)')
          "

      - name: Upload Backend HTML Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.backend-check.outputs.available == 'true' && hashFiles('htmlcov/index.html') != ''
        with:
          name: backend-html-coverage-report
          path: htmlcov


  # 3. Vehicle Simulator Validation
  simulator-verify:
    name: Vehicle Simulator Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if simulator changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            simulator:
              - 'simulator/**'
              - '.github/workflows/ci.yml'

      - name: Setup Python
        if: steps.filter.outputs.simulator == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: simulator/requirements.txt

      - name: Install Simulator Dependencies
        if: steps.filter.outputs.simulator == 'true'
        run: |
          python -m pip install -r simulator/requirements.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.6

      - name: Enforce 200-Line Limit
        if: steps.filter.outputs.simulator == 'true'
        run: |
          FAILED=0

          while IFS= read -r -d '' file; do
            LINES=$(wc -l < "$file")

            if [ "$LINES" -gt 200 ]; then
              echo "$file has $LINES lines (limit is 200)"
              FAILED=1
            fi
          done < <(find simulator -path "simulator/tests" -prune -o -name "*.py" -print0)

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All simulator Python files are within 200 lines."

      - name: Lint Python Code
        if: steps.filter.outputs.simulator == 'true'
        working-directory: simulator
        run: ruff check .

      - name: Run Simulator Tests with 70% Coverage Gate
        if: steps.filter.outputs.simulator == 'true'
        working-directory: simulator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests \
            --cov=communication \
            --cov=scenarios \
            --cov=telemetry \
            --cov=vehicle \
            --cov=main \
            --cov=mqtt_main \
            --cov=mqtt_cli \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            -v

          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.1f}\")")

          echo "### Vehicle Simulator Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Line Coverage:** ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Required Threshold:** 70.0%" >> "$GITHUB_STEP_SUMMARY"

          python -c "
          cov = float('$COVERAGE')
          if cov < 70.0:
              print(f'Simulator coverage {cov}% is below the 70.0% threshold!')
              exit(1)
          print(f'Simulator coverage check passed ({cov}% >= 70.0%)')
          "

      - name: Upload Simulator HTML Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.filter.outputs.simulator == 'true' && hashFiles('simulator/htmlcov/index.html') != ''
        with:
          name: simulator-html-coverage-report
          path: simulator/htmlcov


  # 4. Report Worker Validation
  report-worker-verify:
    name: Report Worker Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if report-worker changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            report_worker:
              - 'report-worker/**'
              - '.github/workflows/ci.yml'

      - name: Setup Python
        if: steps.filter.outputs.report_worker == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: report-worker/requirements.txt

      - name: Install Report Worker Dependencies
        if: steps.filter.outputs.report_worker == 'true'
        run: |
          python -m pip install -r report-worker/requirements.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.6

      - name: Enforce 200-Line Limit
        if: steps.filter.outputs.report_worker == 'true'
        run: |
          FAILED=0

          while IFS= read -r -d '' file; do
            LINES=$(wc -l < "$file")

            if [ "$LINES" -gt 200 ]; then
              echo "$file has $LINES lines (limit is 200)"
              FAILED=1
            fi
          done < <(find report-worker -maxdepth 1 -name "*.py" -print0)

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All report-worker Python files are within 200 lines."

      - name: Lint Python Code
        if: steps.filter.outputs.report_worker == 'true'
        working-directory: report-worker
        run: ruff check .

      - name: Run Report Worker Tests with 70% Coverage Gate
        if: steps.filter.outputs.report_worker == 'true'
        working-directory: report-worker
        run: |
          pytest tests \
            --cov=generator \
            --cov=processor \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            -v

          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.1f}\")")

          echo "### Report Worker Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Line Coverage:** ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Required Threshold:** 70.0%" >> "$GITHUB_STEP_SUMMARY"

          python -c "
          cov = float('$COVERAGE')
          if cov < 70.0:
              print(f'Report worker coverage {cov}% is below the 70.0% threshold!')
              exit(1)
          print(f'Report worker coverage check passed ({cov}% >= 70.0%)')
          "

      - name: Upload Report Worker HTML Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.filter.outputs.report_worker == 'true' && hashFiles('report-worker/htmlcov/index.html') != ''
        with:
          name: report-worker-html-coverage-report
          path: report-worker/htmlcov


  # 4. Security Scans
  security-scan:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      # Semgrep Action wrapper is deprecated; install a fixed CLI version.
      - name: Setup Python for Semgrep
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: |
          python -m pip install semgrep==1.186.0

      - name: Semgrep SAST Scan
        run: semgrep scan --config p/default --error .

      # Install a fixed Trivy release using Aqua Security's maintained setup action.
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2
          cache: true

      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .


  # 6. Mandatory CI Gate
  ci-gate:
    name: Mandatory CI Gate
    runs-on: ubuntu-24.04

    needs:
      - flutter-verify
      - backend-verify
      - simulator-verify
      - report-worker-verify
      - security-scan

    if: always()

    steps:
      - name: Evaluate Mandatory Checks
        env:
          FLUTTER_RESULT: ${{ needs.flutter-verify.result }}
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
          SIMULATOR_RESULT: ${{ needs.simulator-verify.result }}
          REPORT_WORKER_RESULT: ${{ needs.report-worker-verify.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          echo "Flutter result: $FLUTTER_RESULT"
          echo "Backend result: $BACKEND_RESULT"
          echo "Simulator result: $SIMULATOR_RESULT"
          echo "Report worker result: $REPORT_WORKER_RESULT"
          echo "Security result: $SECURITY_RESULT"

          if [[ "$FLUTTER_RESULT" != "success" && "$FLUTTER_RESULT" != "skipped" ]]; then
            echo "Flutter checks failed!"
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend checks failed!"
            exit 1
          fi

          if [[ "$SIMULATOR_RESULT" != "success" && "$SIMULATOR_RESULT" != "skipped" ]]; then
            echo "Simulator checks failed!"
            exit 1
          fi

          if [[ "$REPORT_WORKER_RESULT" != "success" && "$REPORT_WORKER_RESULT" != "skipped" ]]; then
            echo "Report worker checks failed!"
            exit 1
          fi

          if [[ "$SECURITY_RESULT" != "success" ]]; then
            echo "Security scans failed!"
            exit 1
          fi

          echo "All mandatory CI and security gates passed!"
