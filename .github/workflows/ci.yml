
name: Unified CI & Security Pipeline

on:
  pull_request:
    branches: [dev, 'release/*', main]

# Minimum permissions required by the workflow and PR path filtering.
permissions:
  contents: read
  pull-requests: read

# Cancel outdated runs for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # 1. Flutter Frontend Validation
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - name: Setup Flutter
        if: steps.filter.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: flutter pub get

      - name: Analyze Flutter code
        if: steps.filter.outputs.frontend == 'true'
        run: flutter analyze

      - name: Run Flutter tests with coverage
        if: steps.filter.outputs.frontend == 'true'
        run: flutter test --coverage

      - name: Enforce 70% Line Coverage & Generate HTML Report
        if: steps.filter.outputs.frontend == 'true'
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "❌ Coverage report is missing or empty."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y lcov

          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 |
            sed -nE 's/.*lines[^:]*: ([0-9.]+)%.*/\1/p' |
            head -n 1)

          if [ -z "$COVERAGE" ]; then
            echo "❌ Failed to parse coverage percentage."
            exit 1
          fi

          echo "### Flutter Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Line Coverage:** ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Required Threshold:** 70.0%" >> "$GITHUB_STEP_SUMMARY"

          genhtml coverage/lcov.info -o coverage/html

          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov < 70.0) {
              print "❌ Coverage " cov "% is below the 70% threshold!"
              exit 1
            }
          }'

          echo "✅ Coverage check passed (${COVERAGE}% >= 70.0%)"

      - name: Upload Flutter HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.frontend == 'true' && hashFiles('frontend/xev9s_app/coverage/html/index.html') != ''
        with:
          name: flutter-html-coverage-report
          path: frontend/xev9s_app/coverage/html


  # 2. FastAPI Backend Validation
  backend-verify:
    name: FastAPI Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if backend changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - name: Enforce 200-Line Limit on backend/app Python Files
        if: steps.filter.outputs.backend == 'true'
        run: |
          FAILED=0

          if [ -d backend/app ]; then
            while IFS= read -r -d '' file; do
              LINES=$(wc -l < "$file")

              if [ "$LINES" -gt 200 ]; then
                echo "❌ $file has $LINES lines (limit is 200)"
                FAILED=1
              fi
            done < <(find backend/app -name "*.py" -print0)
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "✅ All backend/app Python files are within 200 lines."

      # Python setup runs whenever backend files change.
      # It does not depend on the existence of tests.
      - name: Setup Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI Dependencies & Test Tools
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip

          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          pip install fastapi uvicorn httpx pymongo pyjwt "pwdlib[argon2]" python-dotenv email-validator pytest pytest-cov ruff

      # Lint runs even if backend/tests does not exist.
      - name: Lint Python & FastAPI Code
        if: steps.filter.outputs.backend == 'true'
        run: |
          cd backend
          ruff check --ignore B008 .

      # OpenAPI validation runs even if backend/tests does not exist.
      - name: Validate FastAPI App & OpenAPI Schema
        if: steps.filter.outputs.backend == 'true'
        env:
          PYTHONPATH: ".."
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DB_NAME: "Xev9s_db"
          JWT_SECRET: "test_only_non_secret_jwt_value_32_characters_minimum"
        run: |
          cd backend

          python -c "from backend.app.main import app; schema = app.openapi(); print(f'✅ FastAPI OpenAPI schema valid ({len(schema.get(\"paths\", {}))} endpoints registered)')"

      # Tests run only when Python test files exist.
      - name: Run FastAPI Pytest Suite with 70% Coverage Gate
        if: steps.filter.outputs.backend == 'true' && hashFiles('backend/tests/**/*.py', 'backend/tests/*.py') != ''
        env:
          PYTHONPATH: ".."
          MONGO_URI: "mongodb://localhost:27017"
          MONGO_DB_NAME: "Xev9s_db"
          JWT_SECRET: "test_only_non_secret_jwt_value_32_characters_minimum"
        run: |
          cd backend

          pytest tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=70 \
            -v

      - name: Upload Backend HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.backend == 'true' && hashFiles('backend/htmlcov/index.html') != ''
        with:
          name: backend-html-coverage-report
          path: backend/htmlcov


  # 3. Security Scans
  security-scan:
    name: Security Scans (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

      - name: Install & Run Trivy Filesystem Scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

          trivy fs \
            --scanners vuln,misconfig \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .


  # 4. Mandatory CI Gate
  ci-gate:
    name: Mandatory CI Gate
    runs-on: ubuntu-latest

    needs:
      - flutter-verify
      - backend-verify
      - security-scan

    if: always()

    steps:
      - name: Evaluate Mandatory Checks
        env:
          FLUTTER_RESULT: ${{ needs.flutter-verify.result }}
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
        run: |
          echo "Flutter result: $FLUTTER_RESULT"
          echo "Backend result: $BACKEND_RESULT"
          echo "Security result: $SECURITY_RESULT"

          if [[ "$FLUTTER_RESULT" != "success" && "$FLUTTER_RESULT" != "skipped" ]]; then
            echo "❌ Flutter checks failed!"
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "❌ Backend checks failed!"
            exit 1
          fi

          if [[ "$SECURITY_RESULT" != "success" ]]; then
            echo "❌ Security scans failed!"
            exit 1
          fi

          echo "✅ All mandatory CI and security gates passed!"
