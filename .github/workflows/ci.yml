name: Frontend CI

on:
  pull_request:
    branches: [dev, 'release/*', main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce 70% Line Coverage & Generate HTML Report
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | tr -d '%')
          if [ -z "$COVERAGE" ]; then
            echo "❌ Failed to parse coverage percentage from lcov output."
            exit 1
          fi
          echo "### Flutter Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Line Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Threshold:** 70.0%" >> $GITHUB_STEP_SUMMARY
          genhtml coverage/lcov.info -o coverage/html
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70.0) { print "❌ Coverage " cov "% is below the 70% threshold!"; exit 1 } }'
          echo "✅ Coverage check passed (${COVERAGE}% >= 70.0%)"

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-html-coverage-report
          path: frontend/xev9s_app/coverage/html