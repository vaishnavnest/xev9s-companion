name: Frontend CI

on:
  pull_request:
    branches: [dev, 'release/*', main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/**'

jobs:
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building application..."