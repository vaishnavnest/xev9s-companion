name: Unified CI & Security Pipeline

on:
  pull_request:
    branches: [dev, 'release/*', main]

jobs:
  # 1. Frontend Validation (Runs when frontend or workflow files change)
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - name: Setup Flutter
        if: steps.filter.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: flutter pub get

      - name: Analyze code
        if: steps.filter.outputs.frontend == 'true'
        run: flutter analyze

      - name: Run tests with coverage
        if: steps.filter.outputs.frontend == 'true'
        run: flutter test --coverage

      - name: Enforce 70% Line Coverage & Generate HTML Report
        if: steps.filter.outputs.frontend == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | tr -d '%')
          if [ -z "$COVERAGE" ]; then
            echo "❌ Failed to parse coverage percentage from lcov output."
            exit 1
          fi
          echo "### Flutter Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Line Coverage:** ${COVERAGE}\%" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Threshold:** 70.0%" >> $GITHUB_STEP_SUMMARY
          genhtml coverage/lcov.info -o coverage/html
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 70.0) { print "❌ Coverage " cov "% is below the