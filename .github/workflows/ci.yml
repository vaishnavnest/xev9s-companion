name: Frontend CI

on:
  pull_request:
    branches: [dev, 'release/*', main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/**'

jobs:
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Flutter project exists
        id: check_flutter
        run: |
          if [ -d "frontend/xev9s_app" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found frontend/xev9s_app"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "frontend/xev9s_app not found on this branch; skipping Flutter checks."
          fi

      - name: Setup Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        if: steps.check_flutter.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/xev9s_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Fetch dependencies
        if: steps.check_flutter.outputs.exists == 'true'
        working-directory: frontend/xev9s_app
        run: flutter pub get

      - name: Static code analysis
        if: steps.check_flutter.outputs.exists == 'true'
        working-directory: frontend/xev9s_app
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        if: steps.check_flutter.outputs.exists == 'true'
        working-directory: frontend/xev9s_app
        run: flutter test --coverage