name: Frontend CI

on:
  pull_request:
    branches: [dev, 'release/*', main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'

  # push:
  #   branches: [dev]
  #   paths:
  #     - 'frontend/**'
  #     - '.github/workflows/ci.yml'

jobs:
  flutter-verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/xev9s_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release