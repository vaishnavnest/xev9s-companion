version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: xev9s-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Xev9s_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - xev9s-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xev9s-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: Xev9s_db
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: Xev9s_db
      JWT_SECRET: dev_secret_key_minimum_32_characters_for_xev9s_auth
      JWT_SECRET_KEY: dev_secret_key_minimum_32_characters_for_xev9s_auth
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      VEHICLE_PAIRING_PEPPER: dev_vehicle_pairing_pepper_secret_min_32_chars
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - xev9s-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # 3. Flutter Web Frontend
  frontend:
    build:
      context: ./frontend/xev9s_app
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8000/api/v1
        WS_BASE_URL: ws://localhost:8000/ws
    container_name: xev9s-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xev9s-network

networks:
  xev9s-network:
    driver: bridge

volumes:
  mongodb_data: