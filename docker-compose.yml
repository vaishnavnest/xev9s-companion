services:
  # 1. MongoDB Database (Operational Store)
  mongodb:
    image: mongo:7.0
    container_name: xev9s-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Xev9s_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - xev9s-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Eclipse Mosquitto MQTT Broker (IoT Telemetry & Commands)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: xev9s-mosquitto
    restart: unless-stopped
    ports:
      - "1884:1884"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - xev9s-network

  # 3. FastAPI Backend API & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: xev9s-backend:latest
    container_name: xev9s-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: Xev9s_db
      JWT_SECRET_KEY: dev_secret_key_minimum_32_characters_for_xev9s_auth
      VEHICLE_PAIRING_PEPPER: dev_vehicle_pairing_pepper_secret_min_32_chars
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1884
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - xev9s-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # 4. Flutter Web Client (Alpine Nginx Port 8080)
  frontend:
    build:
      context: ./frontend/xev9s_app
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8000
        WS_BASE_URL: ws://localhost:8000
    image: xev9s-flutter-web:latest
    container_name: xev9s-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xev9s-network

  # 5. Vehicle Simulator (Telemetry Generator & Command Processor)
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: xev9s-vehicle-simulator:latest
    container_name: xev9s-simulator
    restart: unless-stopped
    command: ["python", "mqtt_main.py"]
    environment:
      VEHICLE_ID: XEV-DEMO-001
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1884
      TELEMETRY_INTERVAL: 5
    depends_on:
      mosquitto:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - xev9s-network

  # 6. LocalStack (Simulated AWS SQS & S3 for Target 1)
  localstack:
    image: localstack/localstack:3.8
    container_name: xev9s-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3
      DEFAULT_REGION: us-east-1
    networks:
      - xev9s-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 7. Background Report Worker (Async Report Processing)
  report-worker:
    build:
      context: ./report-worker
      dockerfile: Dockerfile
    image: xev9s-report-worker:latest
    container_name: xev9s-report-worker
    restart: unless-stopped
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test # gitleaks:allow
      AWS_SECRET_ACCESS_KEY: test # gitleaks:allow
      REPORT_QUEUE_URL: http://localstack:4566/000000000000/xev9s-report-queue
      REPORT_BUCKET_NAME: xev9s-reports
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: Xev9s_db
      POLL_INTERVAL: 5
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - xev9s-network

networks:
  xev9s-network:
    driver: bridge

volumes:
  mongodb_data:
